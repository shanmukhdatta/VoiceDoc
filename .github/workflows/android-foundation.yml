name: Android Foundation CI

on:
  push:
    branches:
      - "phase-*/**"
      - "integration/**"
      - "main"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle version
        run: ./gradlew --version
      - name: Unit tests and build debug APK
        run: ./gradlew :core:common:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verify manifest does not request Internet
        run: |
          if grep -Rq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Unexpected Internet permission in manifest"
            exit 1
          fi
          echo "Source manifest has no INTERNET declaration"

      - name: Upload installable debug APK for prototype testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voicedoctor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
