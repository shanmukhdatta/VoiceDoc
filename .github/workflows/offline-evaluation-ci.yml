name: Offline AI Metrics Unit Tests
on:
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/offline-evaluation-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s ml/evaluation -p "test_*.py" -v
